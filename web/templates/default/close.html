<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>抱歉,管理员已关闭面板</title>
    <link rel="stylesheet" href="/static/css/pm-theme.css">
    <style>
        .pm-notice { max-width: 520px; margin: 12vh auto; padding: 32px 36px; background: #fff; border-radius: 12px; box-shadow: 0 12px 32px rgba(16,24,40,.08); border: 1px solid #e6e9ef; text-align: center; }
        .pm-notice h1 { font-size: 20px; margin: 0 0 12px; color: #1f2937; }
        .pm-notice p { color: #4b5563; font-size: 14px; }
        .pm-notice code { background: #f3f4f6; padding: 4px 10px; border-radius: 4px; color: #1f2937; font-size: 15px; }
        @media (max-width: 640px) { .pm-notice { margin: 16px; padding: 24px 20px; } }
    </style>
</head>
<body class="pm-plain">
    <div class="pm-notice">
        <h1>管理员已关闭面板</h1>
        <p>如需重新开启，请在服务器 SSH 终端执行：</p>
        <p><code>pm open</code></p>
    </div>
</body>
</html>
