{% extends "layout.html" %}
{% block content %}
<style>
.lg-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; }
.lg-list { border: 1px solid var(--pm-border); border-radius: var(--pm-radius); max-height: 640px; overflow-y: auto; }
.lg-list div { padding: 9px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #f1f3f6; display: flex; justify-content: space-between; gap: 8px; }
.lg-list div span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lg-list div:hover { background: var(--pm-row-hover); }
.lg-list div.on { background: var(--pm-primary-soft); color: #15803d; font-weight: 600; }
.lg-list .pm-muted { flex-shrink: 0; }
.lg-view {
    background: #1e2430; color: #d1d5db; border-radius: var(--pm-radius); padding: 12px 14px; margin: 0;
    height: 560px; overflow: auto; font-family: Menlo, Consolas, monospace; font-size: 12px; line-height: 19px;
    white-space: pre-wrap; word-break: break-all;
}
.lg-view mark { background: #f59e0b; color: #111827; padding: 0 1px; border-radius: 2px; }
.lg-view .lg-err { color: #fca5a5; }
.lg-view .lg-warn { color: #fcd34d; }
.lg-path { font-family: Menlo, Consolas, monospace; font-size: 12px; color: var(--pm-muted); }
.lg-type { max-width: 160px; }
.lg-clean .pm-stat-sub .btn { margin-top: 8px; }
@media (max-width: 900px) { .lg-layout { grid-template-columns: minmax(0, 1fr); } .lg-view { height: 420px; } }
</style>
<div class="main-content">
	<div class="container-fluid pm-page">
		<div class="pos-box bgw mtb15">
			<div class="position f14 c9 pull-left">
				<a class="plr10 c4" href="/">首页</a>/<span class="plr10 c4">日志</span>
			</div>
		</div>
		<div class="pm-panel" id="logPanel">
			<div class="pm-tabs">
				<span class="pm-tab" data-tab="panel">面板日志</span>
				<span class="pm-tab" data-tab="site">网站日志</span>
				<span class="pm-tab" data-tab="ssh">SSH登录日志</span>
				<span class="pm-tab" data-tab="cron">计划任务日志</span>
				<span class="pm-tab" data-tab="soft">软件日志</span>
				<span class="pm-tab" data-tab="system">系统日志</span>
				<span class="pm-tab" data-tab="clean">日志清理</span>
			</div>
			<div class="pm-tab-body" id="logBody"></div>
		</div>
	</div>
</div>
<script src="/static/app/logs.js?v={{config.version}}"></script>
{% endblock %}
