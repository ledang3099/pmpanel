{% extends "layout.html" %}

{% block content %}

<div class="main-content">
		<div class="container-fluid" style="padding-bottom:54px">
			<div class="pos-box bgw mtb15">
				<div class="position f14 c9 pull-left">
					<a class="plr10 c4" href="/">首页</a>/<span class="plr10 c4">软件管理</span>
				</div>
				<div class="search pull-right">
					<form target="_self" onsubmit='getSList(1);return false;'>
						<input type="text" id="SearchValue" class="ser-text pull-left" placeholder="搜索软件名称或说明" autocomplete="off" />
						<button type="button" class="ser-sub pull-left" onclick='getSList(1)'></button>
					</form>
				</div>
			</div>
			<div class="pm-store bgw mtb15">
				<div class="pm-store-bar">
					<div class="pm-store-tabs" id="softTypes"></div>
					<div class="pm-store-ops">
						<input type="file" style="display:none;" accept=".zip,.tar.gz" id="update_zip">
						<button class="btn btn-default btn-sm" onclick="importPluginOpen()" title="上传第三方插件包(zip)">导入插件</button>
					</div>
				</div>
				<div id="updata_pro_info"></div>
				<div class="pm-store-grid" id="softStore"></div>
				<div class="pm-store-page">
					<div id="softPage" class="page"></div>
				</div>
			</div>
		</div>
	</div>
</div>
<script type="text/javascript" src="/static/js/jquery.dragsort-0.5.2.min.js?v={{config.version}}"></script>
<script type="text/javascript" src="/static/laydate/laydate.js?v={{config.version}}"></script>
<script type="text/javascript" src="/static/app/soft.js?v={{config.version}}"></script>
<script>
//取软件列表
getSList();
</script>


{% endblock %}
